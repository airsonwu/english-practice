<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英語錯題精熟練習</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#1e293b; --sub:#64748b; --line:#e2e8f0;
    --pri:#4f46e5; --pri-soft:#eef2ff; --ok:#059669; --ok-soft:#ecfdf5; --bad:#e11d48; --bad-soft:#fff1f2;
    --warn:#b45309; --warn-soft:#fffbeb; --sky-soft:#f0f9ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:10px 16px}
  .hwrap{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{display:flex;align-items:center;gap:10px;min-width:0}
  .logo .ic{flex:0 0 40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#38bdf8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .logo h1{font-size:18px;margin:0;line-height:1.2}
  .logo p{font-size:13px;margin:0;color:var(--pri);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtns{display:flex;gap:6px}
  .iconbtn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;font-size:18px;padding:0 10px}
  main{max-width:860px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:14px;font-weight:700}
  .tag.red{background:var(--bad-soft);color:var(--bad)}
  .tag.amber{background:var(--warn-soft);color:var(--warn)}
  .tag.green{background:var(--ok-soft);color:var(--ok)}
  .small{font-size:14px;color:var(--sub)}
  .prompt{font-weight:800;font-size:20px;margin:14px 0 10px}
  .passage{background:var(--warn-soft);border-left:5px solid #f59e0b;border-radius:0 14px 14px 0;padding:12px 16px;white-space:pre-line;margin-bottom:12px}
  .dialogue{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px}
  .dialogue div{display:flex;gap:10px;align-items:flex-start;margin:4px 0;font-size:20px}
  .spk{flex:0 0 auto;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .sentence{background:var(--pri-soft);border:1px solid #c7d2fe;border-radius:14px;padding:14px 16px;font-size:21px;font-weight:700;color:#1e1b4b;margin-bottom:12px;white-space:pre-line}
  .sentence u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--bad)}
  .blank{display:inline-block;min-width:90px;border-bottom:3px solid #6366f1;margin:0 2px}
  .opts{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;min-height:60px;font-size:19px;width:100%}
  .opt .L{flex:0 0 34px;height:34px;border-radius:10px;background:#f1f5f9;color:var(--sub);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
  .opt.sel{border-color:var(--pri);background:var(--pri-soft);font-weight:700}
  .opt.sel .L{background:var(--pri);color:#fff}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.right .L{background:var(--ok);color:#fff}
  .opt.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrongpick .L{background:var(--bad);color:#fff}
  input.txt,textarea.txt{width:100%;padding:14px 16px;font-size:22px;font-weight:700;border:2px solid var(--line);border-radius:16px;outline:none;background:#fff;font-family:inherit}
  textarea.txt{font-size:15px;font-weight:500;min-height:160px;resize:vertical}
  input.txt:focus,textarea.txt:focus{border-color:var(--pri);box-shadow:0 0 0 4px #e0e7ff}
  .partlabel{font-weight:800;color:var(--pri);margin:12px 0 6px}
  .tray{min-height:62px;border:2px dashed #a5b4fc;background:#f8faff;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bank{border:1px solid var(--line);background:#f8fafc;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{padding:10px 14px;border-radius:12px;font-size:19px;font-weight:700;border:1px solid #cbd5e1;background:#fff;min-height:48px}
  .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .chip:active{transform:scale(.95)}
  .ph{color:#94a3b8;font-size:15px;padding:0 6px}
  .linkbtn{color:var(--pri);font-weight:700;font-size:15px;padding:6px 4px}
  .hint{margin-top:10px;background:var(--warn-soft);border:1px solid #fde68a;color:var(--warn);border-radius:12px;padding:8px 12px;font-size:16px}
  .btn{min-height:52px;padding:0 22px;border-radius:16px;font-weight:800;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn.pri{background:var(--pri);color:#fff}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.gray{background:#f1f5f9;color:#475569}
  .btn.warn{background:#f59e0b;color:#fff}
  .btn.red{background:var(--bad-soft);color:var(--bad)}
  .btn.full{width:100%}
  .btn.big{min-height:64px;font-size:20px}
  .btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
  .btn:disabled{opacity:.35;pointer-events:none}
  .btn:active{transform:scale(.97)}
  .nav{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .prog{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:6px 0 10px}
  .prog>div{height:100%;background:linear-gradient(90deg,#38bdf8,#4f46e5);transition:width .3s}
  .dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .dot{width:34px;height:34px;border-radius:10px;font-size:14px;font-weight:700;background:#fff;border:1.5px solid #cbd5e1;color:var(--sub)}
  .dot.done{background:#c7d2fe;border-color:#a5b4fc;color:#3730a3}
  .dot.cur{outline:3px solid var(--pri);outline-offset:1px}
  .score{width:160px;height:160px;border-radius:50%;margin:0 auto 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid}
  .score b{font-size:48px;line-height:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:16px 0}
  .cell{border-radius:12px;padding:6px 0;text-align:center;font-weight:800;border:2px solid}
  .cell.ok{border-color:#6ee7b7;background:var(--ok-soft);color:var(--ok)}
  .cell.bad{border-color:#fda4af;background:var(--bad-soft);color:var(--bad)}
  .cell .m{font-size:22px;line-height:1.1}
  .cmp{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
  @media(min-width:640px){.cmp{grid-template-columns:1fr 1fr}}
  .cmp>div{border-radius:12px;padding:10px 12px;border:1px solid}
  .cmp .you{background:var(--bad-soft);border-color:#fecdd3}
  .cmp .ans{background:var(--ok-soft);border-color:#a7f3d0}
  .cmp .lab{font-size:13px;font-weight:800}
  .cmp .you .lab{color:var(--bad)} .cmp .ans .lab{color:var(--ok)}
  .cmp .val{font-weight:800;font-size:19px;word-break:break-word}
  .explain{background:var(--sky-soft);border:1px solid #bae6fd;border-radius:12px;padding:12px 14px;margin-top:8px}
  .explain h4{margin:0 0 4px;color:#075985;font-size:16px}
  .note{background:var(--warn-soft);border:1px solid #fde68a;border-radius:12px;padding:8px 12px;color:var(--warn);font-size:15px;margin-top:8px}
  .err{background:var(--bad-soft);border:1px solid #fecdd3;border-radius:12px;padding:10px 12px;color:var(--bad);font-size:15px;margin-top:10px}
  .banner{background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;border-radius:22px;padding:18px 22px;margin-bottom:16px}
  .banner h2{margin:4px 0;font-size:22px}
  .stack>*+*{margin-top:14px}
  .tree{background:#fff;border:1px solid #bae6fd;border-radius:12px;padding:10px;margin-top:8px;font-size:15px}
  .tree .gp{text-align:center;font-weight:800;color:var(--pri);border-bottom:1px solid var(--line);padding-bottom:6px}
  .tree .kids{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .tree .kids div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
  .sticky-bottom{position:sticky;bottom:12px;display:flex;justify-content:center;margin-top:16px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 8px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .conf{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .sbtn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:12px;background:#f1f5f9;font-size:15px;font-weight:700;color:#334155}
  /* 首頁與引導 */
  .setcard{display:flex;flex-direction:column;gap:10px}
  .setcard h3{margin:0;font-size:19px}
  .setbtns{display:flex;gap:8px;flex-wrap:wrap}
  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps div{flex:1;height:8px;border-radius:999px;background:#e2e8f0}
  .steps div.on{background:var(--pri)}
  .stepno{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;align-items:center;justify-content:center;margin-right:8px}
  .wiz h2{display:flex;align-items:center;margin:0 0 12px;font-size:22px}
  .tips{margin:0;padding-left:22px}
  .tips li{margin:6px 0}
  .big-ico{font-size:44px;text-align:center;margin:4px 0 10px}
  .pv{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
  .pv.unsure{border:2px solid #f59e0b;background:#fffdf5}
  .pv .ctx{font-size:16px;background:#f8fafc;border-radius:10px;padding:8px 10px;margin:6px 0;white-space:pre-line}
  .pv .opt{min-height:46px;padding:8px 10px;font-size:16px}
  .pv input.txt{font-size:17px;padding:10px 12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 18px;border-radius:14px;z-index:70;font-size:16px;max-width:90vw}

  /* ===== 列印 ===== */
  #printArea{display:none}
  @page{size:A4;margin:14mm 14mm 16mm}
  @media print{
    header,main,#modalRoot,.toast,.conf{display:none!important}
    body{background:#fff}
    #printArea{display:block}
  }
  .pa{color:#000;font-size:12pt;line-height:1.55;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif}
  .pa h1{font-size:17pt;text-align:center;margin:0 0 2pt}
  .pa .sub{text-align:center;font-size:10.5pt;margin-bottom:6pt}
  .pa .meta{display:flex;justify-content:space-between;gap:10pt;font-size:11pt;border-bottom:1.5pt solid #000;padding:4pt 0 5pt;margin-bottom:6pt}
  .pa h2{font-size:12.5pt;margin:12pt 0 5pt;border-left:4pt solid #000;padding-left:6pt;break-after:avoid}
  .pa .q{break-inside:avoid;margin:0 0 10pt}
  .pa .qh{display:flex;gap:4pt}
  .pa .qh .no{flex:0 0 auto;white-space:nowrap}
  .pa .body{padding-left:24pt}
  .pa .psg{border:1pt solid #555;border-radius:4pt;padding:5pt 8pt;margin:4pt 0;white-space:pre-line;font-size:11pt}
  .pa .dlg div{margin:1pt 0}
  .pa .sen{margin:3pt 0;white-space:pre-line}
  .pa .sen u{text-decoration-thickness:1.2pt;text-underline-offset:2pt}
  .pa .ops{display:flex;flex-wrap:wrap;gap:2pt 22pt;margin-top:2pt}
  .pa .ops.col{display:block}
  .pa .line{border-bottom:1pt solid #000;height:24pt;margin-top:2pt}
  .pa .blank{display:inline-block;min-width:80pt;border-bottom:1pt solid #000;margin:0 2pt}
  .pa .ans{font-weight:700}
  .pa .ref{font-size:9.5pt;color:#555}
  .pa .exp{font-size:10pt;color:#222;margin-top:2pt}
  .pa .foot{margin-top:14pt;font-size:9pt;color:#666;text-align:center}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">
      <div class="ic">EN</div>
      <div style="min-width:0"><h1>英語錯題精熟練習</h1><p id="phaseLabel"></p></div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="homeBtn" onclick="goHome()" aria-label="回考卷列表">🏠</button>
      <button class="iconbtn" id="soundBtn" onclick="toggleSound()" aria-label="音效開關">🔊</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<div id="printArea"></div>

<script>
/* =====================================================================
   設定：建好 Gemini Gem 之後，把分享連結貼在下面引號裡。
   留空的話，網頁會改用「複製指令 → 貼到 Gemini」的方式引導家長。
   ===================================================================== */
const GEM_URL = "https://gemini.google.com/gem/1mSmH73XweN1kNRD-sL3crKpajRgk_LHc?usp=sharing";
const GEMINI_URL = "https://gemini.google.com/app";
const PROMPT = "你是「英語考卷錯題整理小幫手」。使用者會上傳學生英語考卷的照片或 PDF 檔，請照下面規則整理。\n\n【要做的事】\n1. 考卷上有老師批改痕跡時：只挑出被批改為「錯」的題目（紅筆打叉、扣分、圈起來、有訂正的題目），答對的不要列出來。\n   考卷沒有批改痕跡時（空白題目卷、題庫、之前印出來的錯題重練卷）：把全部題目都整理出來。\n2. 每一題寫出正確答案。正確答案的依據順序：答案卷或答案頁 → 老師寫的訂正 → 你自己判斷。你沒有把握的題目，\"sure\" 要設成 false。\n3. 每一題寫一句簡短的中文解說（why）和一句觀念重點（tip），寫給國中生看，簡單好懂。\n4. 每一題再出一題「同觀念、換內容」的變化題（var），難度和原題一樣。\n5. 題目有圖片時（例如看圖選答案），把圖片內容改成文字寫進題目或選項裡。\n\n【輸出規則（非常重要）】\n- 只輸出一個 ```json 程式碼框，程式碼框前後不要有任何其他文字。\n- 一定要照下面的格式。\n- 照片模糊、看不清楚時不要猜，只回覆一句：「這張照片看不清楚，請重拍（考卷攤平、光線充足、正面拍）」。\n- 這一頁沒有錯題時，輸出 {\"q\":[]}。\n- 使用者之後在同一個對話上傳下一頁時，同樣只輸出那一頁的題目。\n\n【PDF 或一次上傳多頁時】\n- 一次最多整理 2 頁，避免輸出太長被截斷。\n- 還有頁面沒整理完時，在 JSON 最外層加上 \"more\":\"還有第 3～5 頁\"。\n- 使用者回覆「繼續」時，接著整理下 2 頁。全部整理完的那一次，就不要加 \"more\"。\n- 同一個檔案裡如果有答案卷或答案頁，用它來決定正確答案，不要把答案頁本身當成題目。\n\n【格式】\n{\"title\":\"考卷名稱，例如：七年級英語 Unit 1\",\"q\":[ 題目, 題目, … ]}\n\n題目有三種：\n\n1) 選擇題 \"t\":\"c\"\n{\"t\":\"c\",\"sec\":\"二、選擇題\",\"p\":\"選出最適當的答案\",\"dlg\":[[\"A\",\"____ Heather?\"],[\"B\",\"She's Ben's wife.\"]],\"o\":[\"How's\",\"Is she\",\"Who's\",\"Are you\"],\"a\":2,\"why\":\"答句說明她的身分，所以用 Who's 問「她是誰」。\",\"tip\":\"問身分用 Who。\",\"sure\":true,\"var\":{\"dlg\":[[\"A\",\"____ that man?\"],[\"B\",\"He's my uncle.\"]],\"o\":[\"What's\",\"How's\",\"Is he\",\"Who's\"],\"a\":3,\"why\":\"答句說明他的身分，所以用 Who's。\"}}\n- \"a\" 是正確選項的位置，從 0 開始算：A=0、B=1、C=2、D=3。\n\n2) 單字填空 \"t\":\"f\"（只填一個單字）\n{\"t\":\"f\",\"sec\":\"一、單字\",\"p\":\"依句意拼寫出正確單字\",\"sent\":\"Irene is fourteen. She is a j____ high school student.\",\"a\":\"junior\",\"hint\":\"j 開頭，「國中」的國。\",\"why\":\"14 歲是國中生，國中是 junior high school。\",\"tip\":\"國中＝junior high school。\",\"sure\":true,\"var\":{\"sent\":\"Tom is thirteen. He is a j____ high school student.\",\"a\":\"junior\",\"hint\":\"j 開頭。\",\"why\":\"13 歲是國中生。\"}}\n\n3) 寫句子 \"t\":\"w\"（句型轉換、中翻英、重組、造句）\n{\"t\":\"w\",\"sec\":\"六、中翻英\",\"p\":\"中翻英\",\"sent\":\"他是我的狗。牠的名字叫洛基（Rocky）。\",\"a\":[\"It's my dog. Its name is Rocky.\",\"It is my dog. Its name is Rocky.\"],\"why\":\"「牠的」是 Its，沒有撇號。\",\"tip\":\"Its＝牠的；It's＝It is。\",\"sure\":true,\"var\":{\"sent\":\"這是我的貓。牠的名字叫咪咪（Mimi）。\",\"a\":[\"This is my cat. Its name is Mimi.\"],\"why\":\"「牠的」是 Its。\"}}\n- \"a\" 列出所有可以接受的寫法，最標準的放第一個。\n- 要寫 A、B 兩句對話時，不用 \"a\"，改用 \"parts\":[{\"label\":\"A\",\"a\":[\"…\"]},{\"label\":\"B\",\"a\":[\"…\"]}]。\n\n【共用欄位】\n- \"passage\"：閱讀測驗文章或克漏字短文，要完整抄下來，不要刪減。\n- \"dlg\"：對話，格式是 [[\"說話的人\",\"內容\"], …]。\n- \"sent\"：題目句子。空格寫成 ____。「依畫線部分」的畫線文字用 [[ ]] 包起來，例如 His name is [[Lucas]].\n- 閱讀題的變化題可以用同一篇文章、只換問題，var 裡面就不用再寫 passage。\n- 英文的撇號一律用一般的 ' 。\n";

/* ===================== 範例考卷（第一份考卷） ===================== */
const SAMPLE_BANK = [
  // ---------- 一、單字 ----------
  { id:"A1", sec:"一、大小寫與單字", concept:"大小寫互換：全大寫的字要整個改成小寫，一個字母都不能漏。",
    variants:[
      { type:"fill", prompt:"將單字做大小寫互換：", sentence:"BOARD ➔ ____", answers:["board"], hint:"把每個字母都改成小寫。", why:"BOARD 全部改成小寫就是 board。" },
      { type:"fill", prompt:"將單字做大小寫互換：", sentence:"KITCHEN ➔ ____", answers:["kitchen"], hint:"把每個字母都改成小寫。", why:"KITCHEN 全部改成小寫就是 kitchen。" }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function blankify(html){ return html.replace(/_{3,}/g,'<span class="blank">&nbsp;</span>'); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ===================== 音效／朗讀 ===================== */
let actx=null;
function tone(f,d,type){ if(!DB.sound) return; try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(.12,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function toggleSound(){ DB.sound=!DB.sound; saveDB(); document.getElementById("soundBtn").textContent=DB.sound?"🔊":"🔇"; }
function englishOf(v){
  let t = v.dialogue ? v.dialogue.map(d=>d[1]).join(". ") : (v.passage || v.sentence || "");
  t = t.replace(/<[^>]+>/g,"").replace(/_{2,}|\( ?\d ?\)/g," blank ").replace(/➔/g," ");
  return /[A-Za-z]{2,}/.test(t) && !/[一-鿿]/.test(t) ? t : "";
}
function speak(t){ if(!t || !("speechSynthesis" in window)) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85; speechSynthesis.speak(u); }
function speakItem(id,v){ speak(englishOf(BY_ID[id].variants[v])); }

/* ===================== 批改 ===================== */
const CONTR=[["what's","what is"],["who's","who is"],["where's","where is"],["how's","how is"],["that's","that is"],["he's","he is"],["she's","she is"],["it's","it is"],["name's","name is"],["isn't","is not"],["aren't","are not"],["i'm","i am"],["you're","you are"],["they're","they are"],["we're","we are"]];
function norm(s){
  s=fixQ(s).toLowerCase().replace(/[“”"]/g," ").replace(/[.,!?;:，。？！、()（）]/g," ");
  CONTR.forEach(([a,b])=>{ s=s.replace(new RegExp("(^|\\s)"+a+"(?=\\s|$)","g"),"$1"+b); });
  return s.replace(/\s+/g," ").trim();
}
function V(item){ return BY_ID[item.id].variants[item.v]; }
function cur(){ return S.queue[S.idx]; }
function partAnswers(item){
  const v=V(item), key=item.id;
  if(v.type!=="write") return [S.answers[key]];
  return v.parts.map((p,i)=>{
    if((S.modes[key]||"chips")==="chips"){ const c=S.chips[key]&&S.chips[key][i]; return c? c.picked.map(k=>c.tokens[k]).join(" ") : ""; }
    return (S.answers[key]||[])[i]||"";
  });
}
function isAnswered(item){
  const v=V(item);
  if(v.type==="choice") return S.answers[item.id]!==undefined && S.answers[item.id]!==null;
  return partAnswers(item).every(a=>(a||"").trim()!=="");
}
function grade(item){
  const v=V(item);
  if(v.type==="choice") return {ok: S.answers[item.id]===v.answer, note:""};
  if(v.type==="fill") return {ok: v.answers.some(a=>norm(a)===norm(S.answers[item.id])), note:""};
  const ans=partAnswers(item); let ok=true, note="";
  v.parts.forEach((p,i)=>{
    const a=fixQ(ans[i]).trim();
    if(!p.answers.some(x=>norm(x)===norm(a))){ ok=false; return; }
    const endWant=p.answers[0].trim().slice(-1);
    if(a && (a[0]!==a[0].toUpperCase() || (/[.?!]/.test(endWant) && a.slice(-1)!==endWant))) note="意思正確，但句首要大寫、句尾要加「"+endWant+"」，正式考試會被扣分喔！";
  });
  return {ok, note};
}
function correctText(v){
  if(v.type==="choice") return v.options[v.answer];
  if(v.type==="fill") return v.answers[0];
  return v.parts.map(p=>(p.label?p.label+"：":"")+p.answers[0]).join("\n");
}
function userText(item){
  const v=V(item);
  if(v.type==="choice"){ const a=S.answers[item.id]; return a===undefined||a===null ? "（未作答）" : v.options[a]; }
  const arr=partAnswers(item);
  if(v.type==="fill") return arr[0]||"（未作答）";
  return v.parts.map((p,i)=>(p.label?p.label+"：":"")+(arr[i]||"（未作答）")).join("\n");
}

/* ---------- 解析 Gemini 的回覆 ---------- */
function tryParse(s){
  try{ return JSON.parse(s); }catch(e){}
  let t=s.replace(/[“”]/g,'"').replace(/,\s*([}\]])/g,"$1").replace(/ /g," ");
  try{ return JSON.parse(t); }catch(e){}
  return null;
}
function extractObjects(txt){
  const blocks=[]; const re=/```(?:json|JSON)?\s*([\s\S]*?)```/g; let m;
  while((m=re.exec(txt))) blocks.push(m[1]);
  if(!blocks.length){ const s=txt.indexOf("{"), e=txt.lastIndexOf("}"); if(s>=0&&e>s) blocks.push(txt.slice(s,e+1)); }
  return blocks.map(b=>{ let o=tryParse(b.trim());
    if(!o){ const s=b.indexOf("{"), e=b.lastIndexOf("}"); if(s>=0&&e>s) o=tryParse(b.slice(s,e+1)); }
    return o; });
}
const CONF={"its":"it's","it's":"its","is":"are","are":"is","am":"is","his":"her","her":"his","he":"she","she":"he","a":"an","an":"a","my":"your","your":"my","who":"what","what":"who","isn't":"aren't","aren't":"isn't","this":"that","that":"this","they":"we"};
function autoExtra(ans){
  const c=[]; ans.split(" ").forEach(tok=>{ const m=tok.match(/^([A-Za-z']+)(.*)$/); if(!m) return;
    const w=m[1], r=CONF[w.toLowerCase()]; if(!r) return;
    c.push((w[0]===w[0].toUpperCase()? r[0].toUpperCase()+r.slice(1) : r)+m[2]); });
  return shuffle([...new Set(c)]).slice(0,2);
}
function mkVariant(q){
  const type={c:"choice",f:"fill",w:"write"}[q.t]; if(!type) throw Error("看不出是什麼題型");
  const v={type, prompt:String(q.p||"請作答："), why:String(q.why||""), hint:String(q.hint||"")};
  if(q.passage) v.passage=String(q.passage);
  if(Array.isArray(q.dlg)&&q.dlg.length) v.dialogue=q.dlg.map(d=>Array.isArray(d)?[String(d[0]||""),String(d[1]==null?"":d[1])]:["",String(d)]);
  if(q.sent) v.sentence=esc(q.sent).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");
  if(type==="choice"){
    if(!Array.isArray(q.o)||q.o.length<2) throw Error("缺少選項");
    v.options=q.o.map(o=>String(o).replace(/^\s*\(?[A-Da-d][).]\s*/,""));
    v.answer=typeof q.a==="string"&&/^[A-Da-d]$/.test(q.a.trim()) ? "abcd".indexOf(q.a.trim().toLowerCase()) : Number(q.a);
    if(!(v.answer>=0&&v.answer<v.options.length)) throw Error("正確答案的位置不正確");
  }
  if(type==="fill"){
    const a=(Array.isArray(q.a)?q.a:[q.a]).filter(x=>x!=null&&String(x).trim()).map(x=>fixQ(x).trim());
    if(!a.length) throw Error("缺少答案"); v.answers=a;
  }
  if(type==="write"){
    const parts = Array.isArray(q.parts)&&q.parts.length
      ? q.parts.map(p=>({label:String(p.label||""), answers:(Array.isArray(p.a)?p.a:[p.a])}))
      : [{label:"", answers:(Array.isArray(q.a)?q.a:[q.a])}];
    parts.forEach(p=>{ p.answers=p.answers.filter(x=>x!=null&&String(x).trim()).map(x=>fixQ(x).trim()); });
    if(parts.some(p=>!p.answers.length)) throw Error("缺少答案");
    parts.forEach(p=>p.extra=autoExtra(p.answers[0]));

  }

}
function convertQ(q){
  const variants=[mkVariant(q)];
  if(q.var && typeof q.var==="object"){
    try{
      const m=Object.assign({},q,{hint:"",why:""},q.var); delete m.var;
      const ctx=["passage","dlg","sent"]; if(ctx.some(k=>k in q.var)) ctx.forEach(k=>{ if(!(k in q.var)) delete m[k]; });
      if("parts" in q.var) delete m.a; if("a" in q.var && !("parts" in q.var)) delete m.parts;
      variants.push(mkVariant(m));
    }catch(e){}
  }
  return {id:"q"+uid(), sec:String(q.sec||""), concept:String(q.tip||""), sure:q.sure!==false, variants};
}
async function processPaste(){

  if(codeM){ try{ const data=await decodeSet(codeM[0]); addSharedSet(data); }catch(e){ msg.innerHTML=`<div class="err">考卷代碼不完整，請重新複製一次。</div>`; } return; }
  if(!txt.includes("{")){
    msg.innerHTML = /看不清|重拍|模糊/.test(txt)
      ? `<div class="err">Gemini 說照片看不清楚。請回到步驟 2，<b>攤平、光線充足、正面</b>重拍一次。</div><button class="btn gray full" style="margin-top:8px" onclick="wizGo(2)">回步驟 2 重拍</button>`
      : `<div class="err">這段內容裡找不到題目資料。請回 Gemini 跟它說下面這句，再重新複製：</div>${fixLine()}`;
    return;
  }

  objs.forEach(o=>{

  });
  if(!added && !empty){

  if(!d.name) d.name = d.title || `英語考卷 ${new Date().toLocaleDateString("zh-TW")}`;

}

function b64u(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function encodeSet(set){
  const bytes=new TextEncoder().encode(JSON.stringify({n:set.name,b:set.bank}));
  if("CompressionStream" in window){
    try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "EQ1z"+b64u(new Uint8Array(await new Response(st).arrayBuffer())); }catch(e){}
  }
  return "EQ1p"+b64u(bytes);
}
async function decodeSet(code){
  const tag=code[3], bytes=unb64u(code.slice(4)); let json;
  if(tag==="z"){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); json=await new Response(st).text(); }
  else json=new TextDecoder().decode(bytes);
  const o=JSON.parse(json); if(!o || !Array.isArray(o.b) || !o.b.length) throw Error("bad"); return o;
}

function freshState(){ return { phase:"test", round:1, queue:BANK.map(b=>({id:b.id,v:0})), idx:0, answers:{}, orders:{}, chips:{}, modes:{}, hintOpen:{}, results:{}, wrong:[], log:{} }; }

}

function inputHtml(item){

function go(i){ if(i<0||i>=S.queue.length) return; S.idx=i; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }

function refreshProgress(){
  const total=S.queue.length, answered=S.queue.filter(isAnswered).length;
  setLabel((S.phase==="test"?"第一次測驗":`第 ${S.round} 輪 錯題重測`)+`｜已作答 ${answered} / ${total}`);
  const bar=app.querySelector(".prog>div"); if(bar) bar.style.width=(answered/total*100)+"%";
  app.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("done",isAnswered(S.queue[i])));
}
function chip(i,k){ S.chips[cur().id][i].picked.push(k); tone(500,.05); renderQuestion(); }
function unchip(i,pi){ S.chips[cur().id][i].picked.splice(pi,1); tone(360,.05); renderQuestion(); }
function clearChips(i){ S.chips[cur().id][i].picked=[]; renderQuestion(); }
function switchMode(){ const k=cur().id; S.modes[k]=(S.modes[k]||"chips")==="chips"?"type":"chips"; renderQuestion(); }
function openHint(){ S.hintOpen[cur().id]=true; renderQuestion(); }
function trySubmit(){
  const left=S.queue.map((q,i)=>isAnswered(q)?null:i+1).filter(x=>x);
  if(left.length) modal(`還有 ${left.length} 題沒作答`,`第 ${left.join("、")} 題還沒寫。要回去寫完，還是直接交卷？`,[["回去作答","gray",`closeModal();go(${left[0]-1})`],["直接交卷","ok","closeModal();submit()"]]);
  else submit();
}
function submit(){
  S.results={}; S.wrong=[];
  S.queue.forEach(q=>{ const r=grade(q); S.results[q.id]=r; if(!r.ok) S.wrong.push(q.id); S.log[q.id]=S.log[q.id]||[]; S.log[q.id].push(r.ok); });
  S.phase="report"; save(); renderReport(true); window.scrollTo(0,0);
}
function renderReport(fresh){
  const total=S.queue.length, wrong=S.wrong.length, right=total-wrong, score=Math.round(right/total*100), perfect=wrong===0;
  setLabel(`第 ${S.round} 輪 批改結果`);
  const color=perfect?"var(--ok)":score>=70?"var(--pri)":"var(--bad)";
  const notes=S.queue.filter(q=>S.results[q.id]&&S.results[q.id].ok&&S.results[q.id].note);
  app.innerHTML=`<div class="card" style="text-align:center">
      <div class="small" style="margin-bottom:8px">${esc(CUR.name)}</div>
      <div class="score" style="border-color:${color};color:${color}"><span class="small">${S.round===1?"本次得分":"本輪答對"}</span><b>${S.round===1?score:right+"/"+total}</b><span class="small">答對 ${right} / ${total} 題</span></div>
      <h2 style="margin:6px 0">${perfect?(S.round===1?"全對！太厲害了 🌟":"這一輪全部答對了！🎉"):"考卷改好了，加油！💪"}</h2>
      <p class="small" style="font-size:16px">${perfect?"":`有 <b style="color:var(--bad)">${wrong}</b> 題要再複習。先看解說，看懂了再重新挑戰這些題目。`}</p>
      <div class="grid">${S.queue.map((q,i)=>{const r=S.results[q.id]||{};return `<div class="cell ${r.ok?"ok":"bad"}"><div class="small">${i+1}</div><div class="m">${r.ok?(r.note?"✓⚠":"✓"):"✗"}</div></div>`;}).join("")}</div>
      ${notes.length?`<div class="note" style="text-align:left">⚠ 有 ${notes.length} 題意思對了，但大小寫或標點不完整（第 ${notes.map(q=>S.queue.indexOf(q)+1).join("、")} 題），正式考試要注意！</div>`:""}
      <div style="margin-top:18px">${perfect
        ? (S.round===1 ? `<button class="btn ok" onclick="restartSet()">↺ 再做一次</button>` : `<button class="btn ok" onclick="finish()">看精熟成績單 ›</button>`)
        : `<button class="btn warn" onclick="startReview()">📖 看錯題解說（${wrong} 題）</button>`}</div>
    </div>`;
  if(fresh){ if(perfect){ tone(523,.15); setTimeout(()=>tone(659,.2),130); confetti(); } else tone(280,.25,"triangle"); }
}
function startReview(){ S.phase="review"; save(); renderReview(); window.scrollTo(0,0); }
function renderReview(){
  const items=S.queue.filter(q=>S.wrong.includes(q.id));
  setLabel(`錯題解說｜${items.length} 題`);
  app.innerHTML=`<div class="banner"><div class="small" style="color:#fff;opacity:.9">錯題解說模式</div><h2>這 ${items.length} 題要搞懂</h2>
      <div style="font-size:15px">紅色是你的答案、綠色是正確答案。看完解說後，會用「同觀念的新題目」再考一次！</div></div>
    <div class="stack">${items.map((item,n)=>{
      const v=V(item), b=BY_ID[item.id], eng=englishOf(v); let body="";
      if(v.type==="choice"){
        body=`<div class="opts">${S.orders[item.id].map((oi,pos)=>{ const cls=oi===v.answer?"right":(S.answers[item.id]===oi?"wrongpick":"");
          return `<div class="opt ${cls}"><span class="L">${"ABCDEF"[pos]}</span><span>${esc(v.options[oi])}${oi===v.answer?"　✓":""}${cls==="wrongpick"?"　✗ 你選的":""}</span></div>`;}).join("")}</div>`;
        if(S.answers[item.id]===undefined) body=`<div class="note">這題沒有作答</div>`+body;
      } else body=`<div class="cmp"><div class="you"><div class="lab">✗ 你的答案</div><div class="val" style="white-space:pre-line">${esc(userText(item))}</div></div>
              <div class="ans"><div class="lab">✓ 正確答案</div><div class="val" style="white-space:pre-line">${esc(correctText(v))}</div></div></div>`;
      return `<div class="card">
        <div class="row"><span class="tag red">錯題 ${n+1}${b.sec?"｜"+esc(b.sec):""}</span>${eng?`<button class="sbtn" onclick="speakItem('${item.id}',${item.v})">🔈 聽英文</button>`:""}</div>
        <div class="prompt">${esc(v.prompt)}</div>${ctxHtml(v)}${body}
        ${b.sure===false?`<div class="note">⚠ 這題的答案是 AI 判斷的、家長還沒確認，如果覺得怪怪的請問老師。</div>`:""}
        <div class="explain">${v.why?`<h4>💡 為什麼？</h4>${esc(v.why)}`:""}
          ${v.tree?`<div class="tree"><div class="gp">${esc(v.tree.gp)}</div><div class="kids">${v.tree.kids.map(k=>`<div><b>${esc(k[0])}</b><div class="small">${esc(k[1])}</div></div>`).join("")}</div></div>`:""}
          ${b.concept?`<h4 style="margin-top:8px">📌 觀念重點</h4>${esc(b.concept)}`:""}</div>
      </div>`;}).join("")}</div>
    <div class="sticky-bottom"><button class="btn ok" style="box-shadow:0 8px 20px rgba(5,150,105,.35)" onclick="startRetest()">我看懂了！開始錯題重測（${items.length} 題）›</button></div>`;
}
function startRetest(){
  S.round++;
  const want = S.round%2===0 ? 1 : 0;
  S.queue = S.wrong.map(id=>({id, v:Math.min(want, BY_ID[id].variants.length-1)}));
  S.queue.forEach(q=>{ delete S.answers[q.id]; delete S.orders[q.id]; delete S.chips[q.id]; delete S.modes[q.id]; delete S.hintOpen[q.id]; });
  S.idx=0; S.phase="retest"; save(); renderQuestion(); window.scrollTo(0,0);
}
function finish(){ S.phase="done"; save(); renderDone(true); }
function renderDone(fresh){
  setLabel("🎉 全部精熟！");
  const first=BANK.filter(b=>S.log[b.id] && S.log[b.id][0]===false);
  app.innerHTML=`<div class="card" style="text-align:center">
    <div style="font-size:64px">🏆</div>
    <h2 style="margin:4px 0">恭喜！所有錯題都精熟了！</h2>
    <p class="small" style="font-size:16px">${esc(CUR.name)}<br>一共練了 ${S.round} 輪。第一次就答對 ${BANK.length-first.length} / ${BANK.length} 題。</p>
    ${first.length?`<div style="text-align:left;margin-top:14px"><b>曾經錯過的題目（家長／老師可參考）：</b>
      <div class="stack" style="margin-top:8px">${first.map(b=>{const tries=S.log[b.id].length;const lab=b.concept||b.variants[0].prompt;return `<div class="row" style="border:1px solid var(--line);border-radius:12px;padding:8px 12px"><span style="font-size:15px">${esc(lab.length>34?lab.slice(0,34)+"…":lab)}</span><span class="tag ${tries>2?"red":"amber"}" style="white-space:nowrap">練了 ${tries} 次</span></div>`;}).join("")}</div></div>`:""}
    <div class="setbtns" style="margin-top:18px;justify-content:center"><button class="btn pri" onclick="restartSet()">↺ 整份重新再考一次</button><button class="btn gray" onclick="goHome()">回考卷列表</button></div>
  </div>`;
  if(fresh) confetti();
}
function restartSet(){ S=freshState(); save(); render(); window.scrollTo(0,0); }


/* =====================================================================
   列印紙本（考卷／答案卷，可另存 PDF）
   ===================================================================== */
function printDialog(id,v){
  v=v||0; const set=DB.sets.find(s=>s.id===id); const hasVar=set.bank.some(b=>b.variants.length>1);
  modal("🖨 列印紙本",`<p style="margin-top:0">「${esc(set.name)}」共 ${set.bank.length} 題。<br>按下面按鈕會打開列印畫面，可以直接印出來，或在印表機選<b>「另存為 PDF」</b>存成檔案。考卷和答案卷要分開按、各存一次。</p>
    ${hasVar?`<div class="small" style="font-weight:700;margin-bottom:6px">要印哪一種題目？</div>
    <div class="setbtns"><button class="btn sm ${v===0?"pri":"gray"}" onclick="printDialog('${id}',0)">原題</button><button class="btn sm ${v===1?"pri":"gray"}" onclick="printDialog('${id}',1)">變化題（同觀念新題目）</button></div>
    <p class="small">${v===1?"變化題適合拿來再練一次，考孩子是不是真的懂了。":"原題就是考卷上錯的那些題目。"}</p>`:""}`,
    [["列印考卷","pri",`doPrint('${id}',${v},'exam')`],["列印答案卷","ok",`doPrint('${id}',${v},'key')`],["關閉","gray","closeModal()"]]);
}
function pCtx(vv){
  let h="";
  if(vv.samePsg) h+=`<div class="ref">（閱讀上一題的文章作答）</div>`;
  else if(vv.passage) h+=`<div class="psg">${blankify(esc(vv.passage))}</div>`;
  if(vv.dialogue) h+=`<div class="dlg">${vv.dialogue.map(d=>`<div>${d[0]?esc(d[0])+": ":""}${blankify(esc(d[1]))}</div>`).join("")}</div>`;
  if(vv.sentence) h+=`<div class="sen">${blankify(vv.sentence)}</div>`;
  return h;
}
function pPlain(vv){
  const s=[vv.passage?"":(vv.dialogue?vv.dialogue.map(d=>(d[0]?d[0]+": ":"")+d[1]).join("　"):""), vv.sentence?vv.sentence.replace(/<[^>]+>/g,""):""].filter(Boolean).join("　");
  return s.length>70?s.slice(0,70)+"…":s;
}
function examQ(vv,n){
  if(vv.type==="choice"){
    const long=vv.options.some(o=>o.length>22);
    return `<div class="q"><div class="qh"><span class="no">(　　) ${n}.</span><span>${esc(vv.prompt)}</span></div>
      <div class="body">${pCtx(vv)}<div class="ops ${long?"col":""}">${vv.options.map((o,i)=>`<div>(${"ABCDEF"[i]}) ${esc(o)}</div>`).join("")}</div></div></div>`;
  }
  if(vv.type==="fill") return `<div class="q"><div class="qh"><span class="no">${n}.</span><span>${esc(vv.prompt)}</span></div><div class="body">${pCtx(vv)}</div></div>`;
  const lines=vv.parts.map(p=>{ const two=p.answers[0].length>55; return `<div class="line">${p.label?esc(p.label)+"：":""}</div>${two?'<div class="line"></div>':""}`; }).join("");
  return `<div class="q"><div class="qh"><span class="no">${n}.</span><span>${esc(vv.prompt)}</span></div><div class="body">${pCtx(vv)}${lines}</div></div>`;
}
function keyQ(vv,n,b){
  let a;
  if(vv.type==="choice") a=`(${"ABCDEF"[vv.answer]}) ${esc(vv.options[vv.answer])}`;
  else if(vv.type==="fill") a=esc(vv.answers[0]);
  else a=vv.parts.map(p=>(p.label?esc(p.label)+"：":"")+esc(p.answers[0])).join("<br>");
  const ref=vv.type==="choice"?"":pPlain(vv);
  return `<div class="q"><div class="qh"><span class="no">${n}.</span><span class="ans">${a}</span></div>
    <div class="body">${ref?`<div class="ref">題目：${esc(ref)}</div>`:""}
    ${vv.why||b.concept?`<div class="exp">${vv.why?"解說："+esc(vv.why):""}${b.concept?`${vv.why?"<br>":""}觀念：${esc(b.concept)}`:""}</div>`:""}</div></div>`;
}
function buildPrint(set,v,kind){
  let n=0,last=null,body="",lastPsg=null;
  set.bank.forEach(b=>{ let vv=b.variants[Math.min(v,b.variants.length-1)];
    if(kind==="exam" && vv.passage && vv.passage===lastPsg) vv=Object.assign({},vv,{samePsg:true});
    lastPsg=vv.passage||null;
    if((b.sec||"")!==last){ body+=`<h2>${esc(b.sec||"題目")}</h2>`; last=b.sec||""; }
    n++; body+= kind==="exam"?examQ(vv,n):keyQ(vv,n,b); });
  const ver=v===1?"（變化題）":"";
  return `<div class="pa"><h1>${esc(set.name)}</h1>
    <div class="sub">${kind==="exam"?"錯題重練卷":"答案與解說"}${ver}　共 ${n} 題</div>
    ${kind==="exam"?`<div class="meta"><span>班級：__________</span><span>座號：______</span><span>姓名：______________</span><span>得分：______</span></div>`:`<div class="meta"><span></span></div>`}
    ${body}<div class="foot">英語錯題精熟練習</div></div>`;
}
function doPrint(id,v,kind){
  const set=DB.sets.find(s=>s.id===id); closeModal();
  document.getElementById("printArea").innerHTML=buildPrint(set,v,kind);
  const old=document.title;
  document.title=`${set.name}_${kind==="exam"?"考卷":"答案卷"}${v===1?"_變化題":""}`.replace(/[\\/:*?"<>|]/g,"");
  const restore=()=>{ document.title=old; window.removeEventListener("afterprint",restore); };
  window.addEventListener("afterprint",restore);
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast("這個瀏覽器不支援列印"); } setTimeout(restore,60000); },80);
}

/* ===================== 共用 ===================== */
function modal(title,msg,btns){
  document.getElementById("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><h3>${title}</h3><div>${msg}</div>
    <div class="acts">${btns.map(b=>`<button class="btn ${b[1]}" onclick="${b[2]}">${b[0]}</button>`).join("")}</div></div></div>`;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function confetti(){
  const colors=["#f43f5e","#f59e0b","#10b981","#3b82f6","#8b5cf6"];
  for(let i=0;i<70;i++){ const d=document.createElement("div"); d.className="conf";
    d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%5];
    d.style.animationDuration=(1.8+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),4200); }
}
function render(){
  document.getElementById("soundBtn").textContent=DB.sound?"🔊":"🔇";
  document.getElementById("homeBtn").style.visibility = VIEW==="home" ? "hidden" : "visible";
  if(VIEW==="home") return renderHome();
  if(VIEW==="wizard") return renderWizard();
  if(S.phase==="test"||S.phase==="retest") renderQuestion();
  else if(S.phase==="report") renderReport(false);
  else if(S.phase==="review") renderReview();
  else renderDone(false);
}
render();
checkHashImport();
</script>
